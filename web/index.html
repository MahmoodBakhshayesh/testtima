<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TimaCheck web app">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TimaCheck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TimaCheck</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2A5CFF;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Roboto", "Helvetica Neue", Arial, sans-serif;
    }

    /* Fullscreen loader overlay */
    #loader-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #2A5CFF;
      z-index: 9999;
    }

    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .app-text {
      /* Responsive font size: min 32px, ideal 8vw, max 72px */
      font-size: clamp(32px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      position: relative;
      z-index: 2;
      text-transform: uppercase;
    }

    .bracket {
      position: absolute;
      font-size: clamp(36px, 10vw, 90px);
      color: #888888;
      animation: pulseOut 1.5s infinite ease-in-out;
      opacity: 0;
      pointer-events: none;
    }

    .bracket.left {
      left: -10vw;
    }

    .bracket.right {
      right: -10vw;
    }

    @keyframes pulseOut {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.15;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    /* 3-dot loading animation */
    .dots {
      display: flex;
      gap: 0.4rem;
      margin-top: 1.2rem;
      justify-content: center;
    }

    .dot {
      width: 0.7em;
      height: 0.7em;
      border-radius: 50%;
      background-color: #ffffff;
      opacity: 0.2;
      animation: dotBounce 1s infinite ease-in-out;
    }

    .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.2;
      }
      40% {
        transform: translateY(-0.5em);
        opacity: 1;
      }
    }

    .subtitle {
      margin-top: 0.75rem;
      font-size: clamp(12px, 2.5vw, 16px);
      color: #9fb3af;
      opacity: 0.85;
    }
  </style>
</head>
<body>

<!-- Initial loading screen -->
<div id="loader-overlay">
  <div class="loader-container">
<!--    <span class="bracket left">{</span>-->
<!--    <span class="bracket right">}</span>-->
    <div class="app-text">TimaCheck</div>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="subtitle">
      Loading...
    </div>
  </div>
</div>

<!-- Flutter bootstrap -->
<script src="flutter_bootstrap.js" async></script>

<script>
  // Hide loader when Flutter paints its first frame
  window.addEventListener('flutter-first-frame', function () {
    var overlay = document.getElementById('loader-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 200ms ease-out';
      setTimeout(function () {
        overlay.style.display = 'none';
      }, 220);
    }
  });

  // Keep your iframe ready message
  window.addEventListener("load", function () {
    window.parent.postMessage(
      {
        type: "IFRAME_LOADED",
        timestamp: Date.now()
      },
      "*"
    );
  });
</script>
</body>
</html>
