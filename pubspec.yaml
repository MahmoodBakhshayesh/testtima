        - asset: assets/fonts/icomoon.ttf
    - family: Ocr
      fonts:
        - asset: assets/fonts/ocr.ttf
    - family: ArtemisIcons
      fonts:
        - asset: assets/fonts/ArtemisIcons.ttf
